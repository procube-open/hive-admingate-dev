---
plugin: hive_services
services:
  # Guacamole: RDP/VNC/SSH gateway protocol proxy daemon
  guacd:
    image: docker-repository.procube.jp/admingate-guacd:latest
    mode: replicated
    replicas: 2
    endpoint_mode: vip
    placement:
      replicas_max_per_node: 1
    labels:
      HIVE_MARK: guacamole
    environment:
      GUACD_RECORDING_BACKEND: "seaweedfs"
      GUACD_SEAWEEDFS_FILER_URL: "http://seaweedfs-filer:8888"
      GUACD_SEAWEEDFS_RECORDING_PREFIX: "/recordings"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # PostgreSQL: Guacamole authentication and configuration database
  postgres:
    image:
      from: postgres:15
      roles:
        - python-aptk
        - admingate-db
    environment:
      POSTGRES_USER: admingate_user
      POSTGRES_PASSWORD: "{{ db_password }}"
      POSTGRES_DB: admingate_db
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume
        drbd:
          size: 1G
          fstype: xfs
    backup_scripts:
      - name: admingate-app
        backup_command: >-
          PGPASSWORD="$POSTGRES_PASSWORD" pg_dump
          --host=127.0.0.1 --username="$POSTGRES_USER"
          --dbname=admingate_app --format=custom
        restore_command: >-
          PGPASSWORD="$POSTGRES_PASSWORD" pg_restore
          --host=127.0.0.1 --username="$POSTGRES_USER"
          --dbname=admingate_app --clean --if-exists
          --no-owner --no-acl --exit-on-error --single-transaction
        ext: dump
        cleanup_days_before: 10
      - name: seaweedfs-filer-metadata
        backup_command: >-
          PGPASSWORD="$POSTGRES_PASSWORD" pg_dump
          --host=127.0.0.1 --username="$POSTGRES_USER"
          --dbname=admingate_db --format=custom
        restore_command: >-
          PGPASSWORD="$POSTGRES_PASSWORD" pg_restore
          --host=127.0.0.1 --username="$POSTGRES_USER"
          --dbname=admingate_db --clean --if-exists
          --no-owner --no-acl --exit-on-error --single-transaction
        ext: dump
        cleanup_days_before: 10

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim

  admingate-core-server:
    image: docker-repository.procube.jp/admingate-core-server:latest
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      RUST_LOG: "debug"
      ADMINGATE_DATABASE_URL: "postgresql://admingate_user:{{ db_password }}@postgres:5432/admingate_app"
      ADMINGATE_SEAWEEDFS_FILER_URL: "http://seaweedfs-filer:8888"
      ADMINGATE_RECORDING_STORAGE: "seaweedfs"
      ADMINGATE_SEAWEEDFS_RECORDING_PREFIX: "/recordings"
      ADMINGATE_VIRUS_SCAN_ENABLED: "{{ virus_scan_enabled | default('false') }}"
      ADMINGATE_CLAMAV_ADDR: "clamav:3310"
      ADMINGATE_STATIC_DIR: "/app/dist"
      ADMINGATE_CONNECT_TIMEOUT_SECS: "300"
      ADMINGATE_LOGOUT_URL: "https://admingate-core.{{ domain }}/logout"
      ADMINGATE_DOCUMENT_URL: "https://admingate-docs.{{ domain }}"
      ADMINGATE_IDM_URL: "https://idm3.{{ domain }}"
      FILE_HISTORY_WEBHOOK_SECRET: "{{ db_password }}"
      ADMINGATE_AUTH_HEADER: "HTTP_REMOTEUSER"
      ADMINGATE_TIMEZONE: "Asia/Tokyo"
      GUACD_HOST: "guacd"
      GUACD_PORT: "4822"
      GUAC_RECORDING_PATH: "/var/lib/guacamole/recordings"
      GUAC_TYPESCRIPT_PATH: "/var/lib/guacamole/recordings"
      SELENIUM_GRID_URL: "http://selenium-hub:4444/wd/hub"
      SELENIUM_BROWSER_VNC_HOST: "selenium-node-docker"
      SELENIUM_BROWSER_VNC_PORT: "5900"
      SOCKET_WARP_LISTENER_API_URL: "http://socket-warp-listener:8080"
      SOCKET_WARP_CONNECT_HOST: "socket-warp-listener"
      SOCKET_WARP_PORT_RANGE: "12000-12100"
    labels:
      published_name: admingate-core
      webgate:
        proxies:
        - target_port: 8080
          readTimeout: 7200
          maxBodySize: 10
          pathPattern: /
          hideContentDispositionHeader: true
          addRemoteUserHeader: true
          addRemoteGroupHeader: true
          useWebSocket: true
  
  admingate-ftp-server:
    image: docker-repository.procube.jp/admingate-ftp-server:latest
    environment:
      ADMINGATE_DATABASE_URL: postgresql://admingate_user:{{ db_password }}@postgres:5432/admingate_app
      ADMINGATE_SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
      ADMINGATE_VIRUS_SCAN_ENABLED: "{{ virus_scan_enabled | default('false') }}"
      ADMINGATE_FTP_BIND_ADDR: 0.0.0.0:2121
      ADMINGATE_FTP_PASV_HOST: 127.0.0.1
      ADMINGATE_FTP_PASV_PORT_MIN: "40000"
      ADMINGATE_FTP_PASV_PORT_MAX: "40010"
    placement:
      constraints:
        - "node.hostname == {{ ( groups['hives'] | intersect(groups[hive_stage]) | select('match', '.*hive0.*') | first ) | split('.') | first }}"

  admingate-sftp-server:
    image: docker-repository.procube.jp/admingate-sftp-server:latest
    environment:
      ADMINGATE_DATABASE_URL: postgresql://admingate_user:{{ db_password }}@postgres:5432/admingate_app
      ADMINGATE_SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
      ADMINGATE_VIRUS_SCAN_ENABLED: "{{ virus_scan_enabled | default('false') }}"
      ADMINGATE_SFTP_BIND_ADDR: 0.0.0.0:2222
    placement:
      constraints:
        - "node.hostname == {{ ( groups['hives'] | intersect(groups[hive_stage]) | select('match', '.*hive0.*') | first ) | split('.') | first }}"

  admingate-tftp-server:
    image: docker-repository.procube.jp/admingate-tftp-server:latest
    environment:
      ADMINGATE_DATABASE_URL: postgresql://admingate_user:{{ db_password }}@postgres:5432/admingate_app
      ADMINGATE_SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
      ADMINGATE_VIRUS_SCAN_ENABLED: "{{ virus_scan_enabled | default('false') }}"
      ADMINGATE_TFTP_BIND_ADDR: 0.0.0.0:6969
    placement:
      constraints:
        - "node.hostname == {{ ( groups['hives'] | intersect(groups[hive_stage]) | select('match', '.*hive0.*') | first ) | split('.') | first }}"

  admingate-docs-server:
    image: docker-repository.procube.jp/admingate-docs-server:latest
    environment:
      ADMINGATE_DOCS_MANUALS: "user,operator,builder,developer"
      ADMINGATE_DOCS_INDEXING: "private"
      DOCS_SITE_URL: "https://admingate-docs.{{ domain }}"
    labels:
      published_name: admingate-docs
      webgate:
        proxies:
        - target_port: 8080
          pathPattern: /
