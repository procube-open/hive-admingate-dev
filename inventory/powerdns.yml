---
plugin: hive_services
services:
  powerdns:
    image: procube/powerdns:latest
    environment:
      MYSQL_PASSWORD: "{{ db_password }}"
      MYSQL_HOST: pdnsdb
      MYSQL_DNSSEC: "yes"
      MYSQL_CHECK_INTERVAL: "10"
      MYSQL_CHECK_RETRY: "50"
    command:
    - "--api=yes"
    - "--api-key={{db_password}}"
    - "--webserver=yes"
    - "--webserver-address=0.0.0.0"
    - "--webserver-allow-from=0.0.0.0/0"
    ports:
    - "53:53/tcp"
    - "53:53/udp"
    initialize_roles:
    - python-aptk
    - powerdns-init
  pdnsdb:
    image:
      from: "mariadb:10.4"
      roles:
      - python-aptk
      - powerdns-initdb
    environment:
      MYSQL_ROOT_PASSWORD: "{{ db_password }}"
      MYSQL_USER: powerdns
      MYSQL_PASSWORD: "{{ db_password }}"
      MYSQL_DATABASE: powerdns
      # maridb container spend long time to initialize timezone info of the database.
      # it can be skip by following envinronment variable.
      # MYSQL_INITDB_SKIP_TZINFO: "yes"
    endpoint_mode: dnsrr
    volumes:
    - source: pdnsdb_data
      target: /var/lib/mysql
      type: volume
      drbd:
        size: 500M
        fstype: xfs
        available_on:
        - production
        - staging
    backup_scripts:
    - name: powerdns-db
      backup_command: >-
        MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump --user=root
        --host=127.0.0.1 --single-transaction --routines --events
        --triggers --add-drop-database --databases "$MYSQL_DATABASE"
      restore_command: >-
        MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --user=root
        --host=127.0.0.1
      ext: sql
      cleanup_days_before: 10
  pdnsadmin:
    image:
      from: ngoduykhanh/powerdns-admin:0.2.2
      roles:
      - powerdns-admin
    environment:
      SQLALCHEMY_DATABASE_URI: "sqlite:////app/data/padmin.sqlite"
      GUINCORN_TIMEOUT: "60"
      GUNICORN_WORKERS: "2"
    endpoint_mode: dnsrr
    volumes:
    - source: pdnsadmin_data
      target: /app/data
      type: volume
      drbd:
        size: 500M
        fstype: xfs
        available_on:
        - production
        - staging
    backup_scripts:
    - name: powerdns-admin
      backup_command: >-
        python3 -c "import sqlite3; source=sqlite3.connect(\"/app/data/padmin.sqlite\");
        target=sqlite3.connect(\"/tmp/padmin-backup.sqlite\"); source.backup(target);
        target.close(); source.close()"
      backup_file: /tmp/padmin-backup.sqlite
      restore_file: /tmp/padmin-restore.sqlite
      restore_command: >-
        python3 -c "import sqlite3; source=sqlite3.connect(\"/tmp/padmin-restore.sqlite\");
        target=sqlite3.connect(\"/app/data/padmin.sqlite\"); source.backup(target);
        target.close(); source.close()"
      ext: sqlite
      cleanup_days_before: 10
