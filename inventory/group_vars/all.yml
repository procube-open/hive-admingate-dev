---
# parameters for template

# サイトをインターネットに公開する際のドメイン。
domain: "{{ hive_name }}.procube-demo.jp"
# 委任先の FQDN は ns[0-2]-{{ domain }} とする（グルーレコードではなく親ドメインの直下レコードとする）

web_vip: 192.168.0.200
dns_mode: "global"  # global or internal

# Secrets
credentials: "{{ lookup('file', inventory_dir | dirname + '/secrets.yml') | from_yaml | default({}) }}"
db_password: "{{lookup('password', hive_context_dir + '/registry_password length=15 chars=ascii_letters,digits')}}"

# コンテナイメージリポジトリ
ns_container_repository: "docker-repository.procube.jp"

# 攻撃防御：同一ユーザによるログイン失敗回数上限
failedCountLimitByUserid: "5"

# 攻撃防御：同一IPからのログイン失敗回数上限
failedCountLimitBySrcIPAddr: "40"

expireSeconds: "900"
ipWhiteList: []
pwAvailableDays: 0

# DRBD 関連設定
hive_kernel_version: "6.12.0-211.20.1.el10_2.x86_64"
hive_drbd_download_url: "https://github.com/procube-open/drbd9-rpm/releases/download/Latests/drbd-9.2.15-v9.29.0-6.12.0-211.20.1.el10_2.x86_64.tar.gz"

# MongoDB から復元するデータの定義
restore_sequence_mongodb:
- name: ldap_settings
  interfaces:
  - name: _sandboxProvSettings
    key_property: name
    filter:
      name:
        "$in":
        - LdapDBProvisioning
        - LdapSchemaProvisioning
  - name: _sandboxOpenLdapDbSetting
    key_property: number
- name: definitions
  interfaces:
  - name: _sandboxSystemSettings
    key_property: name
  - name: _sandboxClasses
    key_property: name
  - name: _sandboxInterfaces
    key_property: name
  - name: _sandboxGadgets
    key_property: name
  - name: _sandboxProvSettings
    key_property: name
    filter:
      name:
        "$nin":
        - LdapDBProvisioning
        - LdapSchemaProvisioning
- name: layouts
  interfaces:
  - name:  _sandboxRoles
    key_property: name
  - name: _sandboxSidebar
    key_property: name
  - name: _sandboxNavbar
    key_property: name
- name: master_tables
  interfaces:
  - name: LdapGenericObjectEditorIF0
    key_property: dn
  - name: LdapGenericObjectEditorIF1
    key_property: dn
  - name: LdapGenericObjectEditorIF2
    key_property: dn
- name: objects
  interfaces:
  - name: userEditorInterface
    key_property: uid
