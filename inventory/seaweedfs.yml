---
plugin: hive_services
services:
  # SeaweedFS Master: Metadata server and volume management
  seaweedfs-master:
    image:
      from: "{{ seaweedfs_image }}"
      roles:
        - python-aptk
        - put-master-toml
    environment:
      WEED_STORAGE_BACKEND_S3_DEFAULT_AWS_ACCESS_KEY_ID: "{{ seaweedfs_aws_access_key_id }}"
      WEED_STORAGE_BACKEND_S3_DEFAULT_AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_aws_secret_access_key }}"
    command:
      - "master"
      - "-ip=seaweedfs-master"
      - "-mdir=/data"
      - "-defaultReplication=000"
      - "-volumeSizeLimitMB={{ seaweedfs_volume_size_limit_mb }}"
    volumes:
      - source: seaweedfs_master_data
        target: /data
        type: volume
        drbd:
          size: 1G
          fstype: xfs
    backup_scripts:
      # Restore後にSeaweedFS master/volumeサービスの再起動が必要。
      - name: seaweedfs-master-data
        directory: /data
        cleanup_days_before: 3

  # SeaweedFS Volume: Data storage server
  seaweedfs-volume:
    image: "{{ seaweedfs_image }}"
    environment:
      AWS_ACCESS_KEY_ID: "{{ seaweedfs_aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_aws_secret_access_key }}"
      AWS_DEFAULT_REGION: "{{ seaweedfs_s3_region }}"
      SEAWEEDFS_TIER_BUCKET: "{{ seaweedfs_s3_bucket }}"
    command:
      - "volume"
      - "-mserver=seaweedfs-master:9333"
      - "-dir=/data"
      - "-max={{ seaweedfs_volume_max }}"
      - "-ip=seaweedfs-volume"
      - "-port=8080"
      - "-publicUrl=seaweedfs-volume:8080"
    volumes:
      - source: seaweedfs_volume_data
        target: /data
        type: volume
        drbd:
          size: 5G
          fstype: xfs

  # SeaweedFS Filer (API operations)
  seaweedfs-filer:
    image:
      from: "{{ seaweedfs_image }}"
      roles:
        - python-aptk
        - put-filer-toml
    command:
      - "filer"
      - "-master=seaweedfs-master:9333"
      - "-ip=seaweedfs-filer"
      - "-port=8888"

  # SeaweedFS Filer (FUSE mount dedicated with notification enabled)
  seaweedfs-filer-fuse:
    image:
      from: "{{ seaweedfs_image }}"
      roles:
        - python-aptk
        - put-filer-toml
        - put-notification-toml
    command:
      - "filer"
      - "-master=seaweedfs-master:9333"
      - "-ip=seaweedfs-filer-fuse"
      - "-port=8888"
