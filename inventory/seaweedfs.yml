---
plugin: hive_services
services:
  # SeaweedFS Master: Metadata server and volume management
  seaweedfs-master:
    image: chrislusf/seaweedfs:4.23
    command:
      - "master"
      - "-ip=seaweedfs-master"
      - "-mdir=/data"
      - "-defaultReplication=000"
    volumes:
      - source: seaweedfs_master_data
        target: /data
        type: volume
        drbd:
          size: 1G
          fstype: xfs
    backup_scripts:
      # Restore後にSeaweedFS master/volumeサービスの再起動が必要。
      - name: seaweedfs-master-data
        directory: /data
        cleanup_days_before: 3

  # SeaweedFS Volume: Data storage server
  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.23
    command:
      - "volume"
      - "-mserver=seaweedfs-master:9333"
      - "-dir=/data"
      - "-max=100"
      - "-ip=seaweedfs-volume"
      - "-port=8080"
      - "-publicUrl=seaweedfs-volume:8080"
    volumes:
      - source: seaweedfs_volume_data
        target: /data
        type: volume
        drbd:
          size: 5G
          fstype: xfs
    backup_scripts:
      # Restore後にSeaweedFS master/volumeサービスの再起動が必要。
      - name: seaweedfs-volume-data
        backup_command: >-
          tmpdir=$(mktemp -d) &&
          response=$(wget -qO- "http://seaweedfs-master:9333/vol/status?pretty=y") &&
          ids=$(printf "%s\n" "$response" |
          grep -o "\"Id\"[[:space:]]*:[[:space:]]*[0-9]*" |
          sed "s/.*:[[:space:]]*//" | sort -un) &&
          [ -n "$ids" ] &&
          for id in $ids; do
          output=$(weed backup -master=seaweedfs-master:9333 -dir="$tmpdir"
          -volumeId="$id" 2>&1);
          status=$?;
          printf "%s\n" "$output" >&2;
          if [ "$status" -ne 0 ] ||
          ! printf "%s\n" "$output" | grep -q "Successfully backed up volume $id";
          then rm -rf "$tmpdir"; exit 1; fi;
          done &&
          tar czf - -C "$tmpdir" .;
          result=$?;
          rm -rf "$tmpdir";
          exit "$result"
        restore_file: /tmp/seaweedfs-volume-restore.tar.gz
        restore_command: >-
          find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
          tar xzf /tmp/seaweedfs-volume-restore.tar.gz -C /data
        ext: tar.gz
        cleanup_days_before: 3

  # SeaweedFS Filer (API operations)
  seaweedfs-filer:
    image:
      from: chrislusf/seaweedfs:4.23
      roles:
        - python-aptk
        - put-filer-toml
    command:
      - "filer"
      - "-master=seaweedfs-master:9333"
      - "-ip=seaweedfs-filer"
      - "-port=8888"

  # SeaweedFS Filer (FUSE mount dedicated with notification enabled)
  seaweedfs-filer-fuse:
    image:
      from: chrislusf/seaweedfs:4.23
      roles:
        - python-aptk
        - put-filer-toml
        - put-notification-toml
    command:
      - "filer"
      - "-master=seaweedfs-master:9333"
      - "-ip=seaweedfs-filer-fuse"
      - "-port=8888"
