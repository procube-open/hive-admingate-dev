---
plugin: hive_services
services:
  # Selenium Grid Hub: Central hub for browser automation
  selenium-hub:
    image: selenium/hub:latest
    environment:
      SE_SESSION_REQUEST_TIMEOUT: "300"
      SE_SESSION_RETRY_INTERVAL: "5"

  # Docker API bridge for Selenium Node-Docker
  docker-daemon:
    image: alpine/socat:latest
    command:
      - "tcp-listen:2375,fork,reuseaddr"
      - "unix-connect:/var/run/docker.sock"
    mode: global
    volumes:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind

  # Selenium Grid Node-Docker (session-per-container)
  selenium-node-docker:
    image: selenium/node-docker:latest
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_ENABLE_TLS: "false"
      SE_ENABLE_TRACING: "false"
      SE_HTTPS_CERTIFICATE: ""
      SE_HTTPS_PRIVATE_KEY: ""
      SE_JAVA_SSL_TRUST_STORE: ""
      SE_JAVA_SSL_TRUST_STORE_PASSWORD: ""
      SE_OTEL_TRACES_EXPORTER: "none"
      SE_OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED: "false"
      SE_NODE_ENABLE_MANAGED_DOWNLOADS: "false"
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      # Browser containers must join the shared Swarm overlay network so the
      # node can reach their published ports and shared assets volume.
      SE_DOCKER_NETWORK: "hive_default_network"
      # node-docker's bundled socat exposes the mounted Docker socket on
      # loopback, so keep the Docker API URL on 127.0.0.1:2375.
      SE_DOCKER_URL: "http://127.0.0.1:2375"
      SE_NODE_DOCKER_CONFIG_FILENAME: "docker.toml"
      SE_NODE_DOCKER_ASSETS_PATH: "/opt/selenium/assets"
      WEED_FILER_ADDR: "seaweedfs-filer-fuse:8888"
      WEED_MOUNT_DIR: "/mnt"
      WEED_FILER_PATH: "/"
    # node-docker は HOSTNAME から自分自身を Docker inspect するため、
    # Swarm/Codespaces で上書きされた HOSTNAME をコンテナIDに戻す。
    entrypoint: /tmp/entrypoint-with-hostname.sh
    cap_add:
      - SYS_ADMIN
    volumes:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - source: selenium_assets
        target: /opt/selenium/assets
        type: volume
      - source: /tmp/config.toml
        target: /opt/selenium/docker.toml
        type: bind
      - source: /tmp/entrypoint-with-hostname.sh
        target: /tmp/entrypoint-with-hostname.sh
        type: bind
    mode: global
