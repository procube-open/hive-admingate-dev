---
- name: download mongo database
  idm_fact: 
    host: "idm3-bindbroker"
    interface: "{{ item.1.name }}"
    filter: "{{ item.1.filter | default(omit) }}"
  loop: "{{ restore_sequence_mongodb | subelements('interfaces') }}"
  register: mongo_dataset
  loop_control:
    label: "{{item.0.name}} / {{ item.1.name }}"
- include_tasks: idm2md.yml
  loop: "{{ md_ifs }}"
  loop_control:
    loop_var: md_if
- name: transform value to jinja2 expression
  idmdownload_format:
    mongodb_data: "{{ mongo_dataset.results }}"
    targets:
    - interface: _sandboxUpdateBatch
      property: authPassword
      expression: mail_server_auth_password
    - interface: _sandboxUpdateBatch
      property: authUser
      expression: mail_server_auth_user
    - interface: _sandboxUpdateBatch
      property: disableStartTls
      expression: mail_server_start_tls
    - interface: _sandboxUpdateBatch
      property: mailFrom
      expression: mail_server_auth_user
    - interface: _sandboxUpdateBatch
      property: mailPort
      expression: mail_server_port
    - interface: _sandboxUpdateBatch
      property: mailSecure
      expression: mail_server_secure
    - interface: _sandboxUpdateBatch
      property: mailServer
      expression: mail_server_host
    - regex: "\\{SSHA\\}[0-9a-zA-Z+/=]+"
      expression: "db_password"
    - value: "{{ db_password }}"
      expression: "db_password"
    - value: "{{ dn_suffix }}"
      expression: "dn_suffix"
    - value: "{{ domain }}"
      expression: "domain"
    - value: "{{ db_password }}"
      expression: "db_password"
    - value: "{{ dn_suffix | regex_replace('^DC=([^,]*),.*$', '\\1') }}"
      expression: "dn_suffix | regex_replace('^DC=([^,]*),.*$', '\\1')"
  register: idm2_all_dataset
- name: put records to yaml file
  local_action:
    module: copy
    content: |
      {{ idm2_all_dataset.result | to_nice_yaml() }}
    dest: "{{role_path}}/../idm-init/vars/main.yml"