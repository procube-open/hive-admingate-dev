- name: check for user
  junos_command:
    commands:
      - "show configuration system login user {{ login_id }}"
  vars:
    ansible_connection: netconf
    ansible_network_os: junos
  register: result_check_user

- name: create user
  junos_user:
    name: "{{ login_id }}"
    encrypted_password: "{{ login_password | password_hash('sha512') }}"
    role: super-user
    state: present
  vars:
    ansible_connection: netconf
    ansible_network_os: junos
  when: result_check_user.stdout[0] | length < 2

- name: update user
  junos_user:
    name: "{{ login_id }}"
    encrypted_password: "{{ login_password | password_hash('sha512') }}"
    state: present
  vars:
    ansible_connection: netconf
    ansible_network_os: junos
  when: result_check_user.stdout[0] | length > 2

- name: remote login linux shell admin-exec
  expect:
    command: ssh -o StrictHostKeyChecking=no -p "{{ ansible_port }}" -l "{{ login_id }}" "{{ hostname }}"
    responses:
      ".*[Pp]assword:.*": "{{ login_password }}"
    timeout: 10
  changed_when: false
  vars:
    ansible_connection: local
