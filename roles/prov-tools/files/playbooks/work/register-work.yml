---
- name: Get works.
  uri:
    url: "http://admingate-core-server:8081/admin/works"
    headers:
      HTTP_REMOTEUSER: "{{ username }}"
      X-Auth-Role: ADMIN
    method: GET
    validate_certs: false
    return_content: yes
    status_code: 200
  register: admin_works

- name: Find existing work id.
  set_fact:
    work_id: "{{ item.id }}"
  when: item.name == name and work_id is not defined
  loop: "{{ admin_works.json | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build file transfer permissions.
  set_fact:
    work_file_transfer_permissions:
      http:
        connect: true
        read: "{{ not (disableDownload | default(false) | bool) }}"
        write: "{{ not (disableUpload | default(false) | bool) }}"
      web_sftp:
        connect: true
        read: "{{ not (disableDownload | default(false) | bool) }}"
        write: "{{ not (disableUpload | default(false) | bool) }}"
      ftp:
        connect: true
        read: "{{ not (disableDownload | default(false) | bool) }}"
        write: "{{ not (disableUpload | default(false) | bool) }}"
      sftp:
        connect: true
        read: "{{ not (disableDownload | default(false) | bool) }}"
        write: "{{ not (disableUpload | default(false) | bool) }}"
      tftp:
        connect: true
        read: "{{ not (disableDownload | default(false) | bool) }}"
        write: "{{ not (disableUpload | default(false) | bool) }}"

- name: Build work payload.
  set_fact:
    work_payload:
      name: "{{ name }}"
      worker_ids: "{{ resultUsers | default([]) | unique | list }}"
      manager_ids: "{{ manageUsers | default([]) | unique | list }}"
      target_ids: "{{ resultConnections | default([]) | unique | list }}"
      file_transfer_permissions: "{{ work_file_transfer_permissions }}"

- name: Set first period.
  set_fact:
    first_period: "{{ (Periods | default([])) | first }}"
  when: (Periods | default([]) | length) > 0

- name: Set first period time values.
  set_fact:
    first_period_daily_start_time: >-
      {{
        '%02d:%02d' | format(
          first_period.startHour | default('0') | int,
          first_period.startMinute | default('0') | int
        )
        if (
          first_period.specificTime | default(false) | bool
          and (first_period.startHour | default('') | string | trim is match('^[0-9]+$'))
          and (first_period.startMinute | default('') | string | trim is match('^[0-9]+$'))
          and ((first_period.startHour | default('0') | int) >= 0 and (first_period.startHour | default('0') | int) <= 23)
          and ((first_period.startMinute | default('0') | int) >= 0 and (first_period.startMinute | default('0') | int) <= 59)
        )
        else ''
      }}
    first_period_daily_end_time: >-
      {{
        '%02d:%02d' | format(
          first_period.endHour | default('0') | int,
          first_period.endMinute | default('0') | int
        )
        if (
          first_period.specificTime | default(false) | bool
          and (first_period.endHour | default('') | string | trim is match('^[0-9]+$'))
          and (first_period.endMinute | default('') | string | trim is match('^[0-9]+$'))
          and ((first_period.endHour | default('0') | int) >= 0 and (first_period.endHour | default('0') | int) <= 23)
          and ((first_period.endMinute | default('0') | int) >= 0 and (first_period.endMinute | default('0') | int) <= 59)
        )
        else ''
      }}
  when: first_period is defined

- name: Add first period to work payload.
  set_fact:
    work_payload: >-
      {{
        work_payload | combine({
          'valid_from_date': first_period.validFrom,
          'valid_until_date': first_period.validUntil,
          'daily_start_time': first_period_daily_start_time,
          'daily_end_time': first_period_daily_end_time
        })
      }}
  when: first_period is defined

- name: Create work.
  uri:
    url: "http://admingate-core-server:8081/admin/works"
    headers:
      HTTP_REMOTEUSER: "{{ username }}"
      X-Auth-Role: ADMIN
      Content-Type: "application/json"
    method: POST
    body_format: raw
    body: "{{ work_payload | to_json }}"
    validate_certs: false
    status_code: 201
  when: work_id is not defined

- name: Update work.
  uri:
    url: "http://admingate-core-server:8081/admin/works/{{ work_id }}"
    headers:
      HTTP_REMOTEUSER: "{{ username }}"
      X-Auth-Role: ADMIN
      Content-Type: "application/json"
    method: PUT
    body_format: raw
    body: "{{ work_payload | to_json }}"
    validate_certs: false
    status_code: 200
  when: work_id is defined
