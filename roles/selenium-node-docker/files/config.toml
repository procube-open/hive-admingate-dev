[docker]
# node-docker's bundled socat exposes the mounted Docker socket on loopback,
# so keep the Docker API URL on 127.0.0.1:2375.
url = "http://127.0.0.1:2375"
configs = [
  "docker-repository.procube.jp/selenium-standalone-custom-weed:latest", '{"browserName": "chrome", "platformName": "linux", "selenium:vncEnabled": true}'
]
# Pass FUSE device through to browser containers so weed mount can run without
# relying on Swarm-only device/security flags.
devices = ["/dev/fuse:/dev/fuse"]
# Allow node-docker to pass selected host config options when needed.
# Do not forward ShmSize: Selenium already starts browser containers with 2GB,
# and copying the node container's default HostConfig would downgrade it to 64MB.
host-config-keys = ["Mounts", "Binds", "ExtraHosts", "CapAdd", "Devices", "SecurityOpt"]
