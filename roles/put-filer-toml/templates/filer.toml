[filer.store]
# Use postgres2 so multiple filer instances share one metadata store
["postgres2"]
enabled = true
createTable = """
	CREATE TABLE IF NOT EXISTS "%s" (
		dirhash   BIGINT,
		name      VARCHAR(65535),
		directory VARCHAR(65535),
		meta      bytea,
		PRIMARY KEY (dirhash, name)
	);
"""
hostname = "postgres"
port = 5432
username = "admingate_user"
password = "{{ db_password }}"
database = "admingate_db"
schema = ""
sslmode = "disable"
connection_max_idle = 10
connection_max_open = 50
connection_max_lifetime_seconds = 300
pgbouncer_compatible = false
enableUpsert = true
upsertQuery = """
	INSERT INTO "%[1]s" (dirhash, name, directory, meta)
		VALUES($1, $2, $3, $4)
		ON CONFLICT (dirhash, name) DO UPDATE SET
			directory=EXCLUDED.directory,
			meta=EXCLUDED.meta
"""
