                isArray: false
                maxLen: 128
                name: name
                outputLdapSchema: false
                pattern: ^[A-Za-z0-9=\.@\-_]*$
                patternForInput: ^[A-Za-z0-9=\.@\-_]*$
                required: true
                stringRestriction: id
                type: string
                unique: true
                uniqueIgnoreCase: false
            -   allowAnotherValue: false
