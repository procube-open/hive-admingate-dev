            -   descriptionEx: '"xpathに \"(ダブルクォーテーション)を使うことはできません。 \''(シングルクォーテーション)を用いてください。"'
                isWarning: false
                validateEx: "this().targetElementPath\r\n? !this().targetElementPath.toString().includes('\\\"')\r\n:
                    true"
        -   description: AWS IAM ポリシーの一覧を保持する。作業申請のポリシー一覧に表示される
            displayName: IAMポリシー
            isNestedObject: false
            isPrimaryAndNestedObject: false
            keyProperty: name
            name: iamPolicy
            outputLdapSchema: false
            propertyDefinitionList:
            -   allowAnotherValue: false
                displayName: ポリシー名
                isArray: false
                maxLen: 128
                name: name
                outputLdapSchema: false
                pattern: ^[A-Za-z0-9=\.@\-_]*$
                patternForInput: ^[A-Za-z0-9=\.@\-_]*$
                required: true
                stringRestriction: id
                type: string
                unique: true
                uniqueIgnoreCase: false
            -   allowAnotherValue: false
                displayName: 説明
                isArray: false
                maxLen: 1000
                name: description
                outputLdapSchema: false
                pattern: ^[A-Za-z0-9 \+=,\.@\-_]*$
                patternForInput: ^[A-Za-z0-9 \+=,\.@\-_]*$
                required: false
                type: string
                unique: false
