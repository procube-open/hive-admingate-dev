<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Login Mock</title>
    <style>
      body { font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { width: 320px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      input, button { width: 100%; margin-top: 8px; padding: 8px; box-sizing: border-box; }
      #error { color: #c00; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Mock Login</h3>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="login-btn" type="button">Sign in</button>
      <p id="error"></p>
    </div>

    <script>
      const USERNAME = "demo";
      const PASSWORD = "secret";

      document.getElementById("login-btn").addEventListener("click", () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const error = document.getElementById("error");

        if (username === USERNAME && password === PASSWORD) {
          window.location.href = "/";
          return;
        }

        error.textContent = "invalid credentials";
      });
    </script>
  </body>
</html>
